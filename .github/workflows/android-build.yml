name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      changelog:
        description: '更新日志（可选）'
        required: false
        default: ''

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted

    env:
      ANDROID_HOME: /home/ayin/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
      # 签名配置（从 GitHub Secrets 读取）
      KEYSTORE_PATH: /home/ayin/android-key/class-mansys-release.keystore
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # 前端 API 地址（生产）
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ✅ 生成版本号
        id: version
        run: |
          chmod +x scripts/ci-version.sh
          source <(scripts/ci-version.sh)
          echo "VERSION_CODE=${versionCode}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${versionName}" >> $GITHUB_OUTPUT
          echo "APK_FILENAME=${apkFileName}" >> $GITHUB_OUTPUT

      - name: 📦 写入 Keystore
        run: |
          mkdir -p /home/ayin/android-key
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /home/ayin/android-key/class-mansys-release.keystore
          chmod 600 /home/ayin/android-key/class-mansys-release.keystore

      - name: 📦 Install frontend dependencies
        run: npm ci
        working-directory: frontend-v3

      - name: 🏗️ Build frontend (H5)
        run: npm run build
        working-directory: frontend-v3
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://cls.ayinserver.xin' }}

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android
        working-directory: frontend-v3

      - name: 🏗️ Build Android APK (prodRelease)
        run: |
          cd frontend-v3/android
          chmod +x gradlew
          # 自托管 runner 默认 Java 25 不兼容 Gradle 8.14，显式使用 Java 21
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          ./gradlew assembleProdRelease \
            -PversionCode=${{ steps.version.outputs.VERSION_CODE }} \
            -PversionName=${{ steps.version.outputs.VERSION_NAME }}
        env:
          KEYSTORE_PATH: /home/ayin/android-key/class-mansys-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 📋 列出构建产物
        run: |
          echo "=== APK files ==="
          find frontend-v3/android/app/build/outputs/apk -name "*.apk" -type f
          echo "=== AAB files ==="
          find frontend-v3/android/app/build/outputs/bundle -name "*.aab" -type f 2>/dev/null || echo "(none)"

      - name: 📦 复制 APK 到 backend/apk/
        run: |
          mkdir -p backend/apk
          # 找到 prodRelease APK
          APK_SRC=$(find frontend-v3/android/app/build/outputs/apk -name "*prod*release*.apk" -type f | head -1)
          if [ -z "$APK_SRC" ]; then
            APK_SRC=$(find frontend-v3/android/app/build/outputs/apk -name "*release*.apk" -type f | head -1)
          fi
          if [ -n "$APK_SRC" ]; then
            cp "$APK_SRC" "backend/apk/${{ steps.version.outputs.APK_FILENAME }}"
            echo "Copied: $APK_SRC → backend/apk/${{ steps.version.outputs.APK_FILENAME }}"
            ls -lh "backend/apk/${{ steps.version.outputs.APK_FILENAME }}"
          else
            echo "⚠️ 未找到 APK 产物"
            find frontend-v3/android/app/build/outputs -type f | head -30
            exit 1
          fi

      - name: 📋 获取 APK 大小
        id: apk-info
        run: |
          APK_PATH="backend/apk/${{ steps.version.outputs.APK_FILENAME }}"
          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "SIZE=${APK_SIZE}" >> $GITHUB_OUTPUT

      - name: 📝 更新 app-version.json
        run: |
          CHANGELOG="${{ github.event.head_commit.message || github.event.inputs.changelog || '自动构建更新' }}"
          # 转义 JSON 特殊字符
          CHANGELOG_ESCAPED=$(echo "$CHANGELOG" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))' 2>/dev/null || echo "\"$CHANGELOG\"")
          bash scripts/update-app-version.sh \
            "${{ steps.version.outputs.VERSION_NAME }}" \
            "${{ steps.version.outputs.VERSION_CODE }}" \
            "${{ steps.apk-info.outputs.SIZE }}" \
            "$CHANGELOG_ESCAPED"

      - name: 🚀 提交更新到仓库
        run: |
          git config user.name "CI Bot"
          git config user.email "ci@clamansys.app"
          git add backend/apk/${{ steps.version.outputs.APK_FILENAME }}
          git add backend/data/app-version.json
          git commit -m "chore: auto-build APK v${{ steps.version.outputs.VERSION_NAME }} (code ${{ steps.version.outputs.VERSION_CODE }})" || echo "无变更需要提交"
          git push origin main

      - name: 🔄 重启后端服务
        run: |
          export XDG_RUNTIME_DIR=/run/user/1000
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
          systemctl --user restart class-mansys.service

      - name: ✅ 验证服务状态
        run: |
          sleep 3
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3002/ 2>/dev/null || echo "000")
          echo "Frontend status: $STATUS"
          LATEST=$(curl -s http://127.0.0.1:3002/api/app/latest 2>/dev/null || echo "{}")
          echo "Latest version: $(echo $LATEST | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("data",{}).get("versionName","unknown"))' 2>/dev/null || echo "unknown")"
