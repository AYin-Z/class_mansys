name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      changelog:
        description: '更新日志（可选）'
        required: false
        default: ''

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

# 构建完成后要把 app-version.json 提交回仓库（CI Bot），
# 默认 GITHUB_TOKEN 是只读的，缺了这段会 403：
#   remote: Permission to AYin-Z/class_mansys.git denied to github-actions[bot].
permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted

    env:
      ANDROID_HOME: /home/ayin/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
      # ⚠️ 签名相关的 KEYSTORE_PATH / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      # 不在这里设默认值：build.gradle 是「KEYSTORE_PATH 非空 → release 签名，否则 debug 签名」，
      # 若在此处无条件给出 KEYSTORE_PATH，缺 secrets 时会拿空口令去走 release 签名而失败，
      # 回退 debug 的分支就永远不会生效。签名参数统一由「🔐 准备签名」步骤注入。
      # 前端 API 地址（生产）
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 本机已装 OpenJDK 21，直接用本地 JDK：
      # 原先用 actions/setup-java@v4 需要从 codeload.github.com 下载 action 包，
      # 该机器到 GitHub 的网络经常超时（2026-06-27 与 2026-09-11 两次构建均因此失败）。
      - name: Use local JDK 21
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"
          /usr/lib/jvm/java-21-openjdk-amd64/bin/java -version

      - name: ✅ 生成版本号
        id: version
        run: |
          chmod +x scripts/ci-version.sh
          source <(scripts/ci-version.sh)
          echo "VERSION_CODE=${versionCode}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${versionName}" >> $GITHUB_OUTPUT
          echo "APK_FILENAME=${apkFileName}" >> $GITHUB_OUTPUT

      - name: 📦 准备 Keystore
        run: |
          KEYSTORE=/home/ayin/android-key/class-mansys-release.keystore
          mkdir -p /home/ayin/android-key
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "从 secret KEYSTORE_BASE64 写入 keystore"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
          elif [ -s "$KEYSTORE" ]; then
            echo "secret 未设置，沿用机器上已有的 keystore：$KEYSTORE"
          else
            echo "::error::缺少 release keystore：secret KEYSTORE_BASE64 为空且机器上没有 $KEYSTORE。请先运行 scripts/setup-github-secrets.sh 上传签名密钥。"
            exit 1
          fi

      - name: 🔐 准备签名（有 secrets 走 release，否则回退 debug）
        run: |
          if [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            {
              echo "SIGN_MODE=release"
              echo "KEYSTORE_PATH=/home/ayin/android-key/class-mansys-release.keystore"
              echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "✅ 使用 release 签名"
          else
            {
              echo "SIGN_MODE=debug"
              # 显式清空，确保 build.gradle 走到 debug 签名分支（即使以后有人在 job env 里加了默认值）
              echo "KEYSTORE_PATH="
              echo "KEYSTORE_PASSWORD="
              echo "KEY_ALIAS="
              echo "KEY_PASSWORD="
            } >> "$GITHUB_ENV"
            echo "::warning::未配置 release 签名 secrets（KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD），本次回退 debug 签名。"
            echo "说明：线上已发布的 APK（v1.2.0）本身即 CN=Android Debug 调试签名，因此 debug 签名的新包可以直接覆盖安装；"
            echo "配置 secrets 后本工作流会自动切回 release 签名（届时用户需卸载重装一次）。"
          fi

      - name: 📦 Install frontend dependencies
        run: npm ci
        working-directory: frontend-v3

      - name: 🏗️ Build frontend (H5)
        run: npm run build
        working-directory: frontend-v3
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://cls.ayinserver.xin' }}

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android
        working-directory: frontend-v3

      - name: 🏗️ Build Android APK (prodRelease)
        run: |
          cd frontend-v3/android
          chmod +x gradlew
          # 自托管 runner 默认 Java 25 不兼容 Gradle 8.14，显式使用 Java 21
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          ./gradlew assembleProdRelease \
            -PversionCode=${{ steps.version.outputs.VERSION_CODE }} \
            -PversionName=${{ steps.version.outputs.VERSION_NAME }}
          # 签名参数由上一步写入 $GITHUB_ENV：
          #   release 模式 → KEYSTORE_PATH/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD 齐全，用 release 签名
          #   debug 模式   → KEYSTORE_PATH 未设置，build.gradle 自动降级为 debug 签名

      - name: 📋 列出构建产物
        run: |
          echo "=== APK files ==="
          find frontend-v3/android/app/build/outputs/apk -name "*.apk" -type f
          echo "=== AAB files ==="
          find frontend-v3/android/app/build/outputs/bundle -name "*.aab" -type f 2>/dev/null || echo "(none)"

      - name: 📦 复制 APK 到发布目录（仓库外）
        run: |
          APK_OUT_DIR="${APK_OUT_DIR:-/home/ayin/class-mansys-artifacts/apk}"
          mkdir -p "$APK_OUT_DIR"
          # 找到 prodRelease APK
          APK_SRC=$(find frontend-v3/android/app/build/outputs/apk -name "*prod*release*.apk" -type f | head -1)
          if [ -z "$APK_SRC" ]; then
            APK_SRC=$(find frontend-v3/android/app/build/outputs/apk -name "*release*.apk" -type f | head -1)
          fi
          if [ -n "$APK_SRC" ]; then
            cp "$APK_SRC" "$APK_OUT_DIR/${{ steps.version.outputs.APK_FILENAME }}"
            echo "Copied: $APK_SRC → $APK_OUT_DIR/${{ steps.version.outputs.APK_FILENAME }}"
            ls -lh "$APK_OUT_DIR/${{ steps.version.outputs.APK_FILENAME }}"
          else
            echo "⚠️ 未找到 APK 产物"
            find frontend-v3/android/app/build/outputs -type f | head -30
            exit 1
          fi

      - name: 📋 获取 APK 大小
        id: apk-info
        run: |
          APK_PATH="${APK_OUT_DIR:-/home/ayin/class-mansys-artifacts/apk}/${{ steps.version.outputs.APK_FILENAME }}"
          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "SIZE=${APK_SIZE}" >> $GITHUB_OUTPUT

      - name: 📝 更新 app-version.json
        # ⚠️ 提交信息必须经 env 传入，不能直接内插进 run: 脚本体：
        # 多行 commit message（带换行/引号）会把 shell 脚本拦腰截断，
        # 之前的失败就是 "line 14: input: command not found"（exit 127）。
        # changelog 传**原始文本**，JSON 转义交给脚本自己处理（不要再 json.dumps）。
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          APK_FILENAME: ${{ steps.version.outputs.APK_FILENAME }}
          APK_SIZE: ${{ steps.apk-info.outputs.SIZE }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          INPUT_MSG: ${{ github.event.inputs.changelog }}
        run: |
          # changelog 只取提交标题行，避免整段提交正文塞进 App 更新弹窗
          CHANGELOG="${INPUT_MSG:-$(printf '%s' "$HEAD_MSG" | head -1)}"
          CHANGELOG="${CHANGELOG:-自动构建更新}"
          bash scripts/update-app-version.sh \
            "$VERSION_NAME" \
            "$VERSION_CODE" \
            "$APK_SIZE" \
            "$CHANGELOG" \
            "$APK_FILENAME"

      - name: 🚀 提交更新到仓库
        run: |
          git config user.name "CI Bot"
          git config user.email "ci@clamansys.app"
          git add backend/data/app-version.json
          git commit -m "chore: auto-build APK v${{ steps.version.outputs.VERSION_NAME }} (code ${{ steps.version.outputs.VERSION_CODE }})" || echo "无变更需要提交"
          git push origin main

      - name: 🔄 同步代码到生产目录
        # 生产服务跑在 /home/ayin/Current_Works/class_mansys（与 runner 的 checkout 不是一个目录），
        # 上一步只是把 app-version.json 推回了 GitHub；这里把它拉到生产目录，
        # 否则 /api/app/latest 永远返回旧版本（重启也白搭）。
        # 生产目录若有本地改动，pull 会失败——只告警不中断构建（重启照旧）。
        run: |
          PROD_DIR=/home/ayin/Current_Works/class_mansys
          git -C "$PROD_DIR" fetch origin main
          git -C "$PROD_DIR" pull --ff-only origin main || {
            echo "::warning::生产目录 $PROD_DIR 未能快进合并（可能有本地改动），版本文件未更新，请手动处理"
            git -C "$PROD_DIR" status --short | head -10
          }
          echo "生产目录 app-version.json："
          head -6 "$PROD_DIR/backend/data/app-version.json"

      - name: 🔄 重启后端服务
        run: |
          export XDG_RUNTIME_DIR=/run/user/1000
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
          systemctl --user restart class-mansys.service

      - name: ✅ 验证服务状态
        run: |
          sleep 3
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3002/ 2>/dev/null || echo "000")
          echo "Frontend status: $STATUS"
          LATEST=$(curl -s http://127.0.0.1:3002/api/app/latest 2>/dev/null || echo "{}")
          echo "Latest version: $(echo $LATEST | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("data",{}).get("versionName","unknown"))' 2>/dev/null || echo "unknown")"
