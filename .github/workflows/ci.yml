name: CI (lint + test)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Lint
        run: npm run lint
        working-directory: backend
      - name: Unit + smoke tests
        run: npm test
        working-directory: backend
      - name: Migration status
        run: node scripts/migrate.js status
        working-directory: backend

  frontend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend-v3
      - name: Lint
        run: npm run lint
        working-directory: frontend-v3
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend-v3
      - name: Unit tests
        run: npm test
        working-directory: frontend-v3
      - name: Build
        run: npm run build
        working-directory: frontend-v3
        env:
          VITE_API_BASE_URL: https://cls.ayinserver.xin
