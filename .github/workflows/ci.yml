name: CI (lint + test)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: self-hosted
    # ⚠️ 本仓库是公开仓库：数据库口令只能走 GitHub Secrets，绝不能写进本文件。
    # 专用测试账号 ci_runner 只有 class_manage_sys_test 库的权限（无法读生产库），
    # 由 scripts/setup-ci-db-user.sh 在宿主机 MySQL 上创建。
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: class_manage_sys_test
      DB_USER: ${{ secrets.CI_DB_USER || 'ci_runner' }}
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      JWT_SECRET: ci_only_test_secret_please_do_not_reuse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Lint
        run: npm run lint
        working-directory: backend
      - name: 应用数据库迁移（测试库）
        run: node scripts/migrate.js up
        working-directory: backend
      - name: Unit + smoke tests
        run: npm test
        working-directory: backend
      - name: Migration status
        run: node scripts/migrate.js status
        working-directory: backend

  # 真实浏览器冒烟（P1-1）：三次"手机白屏"单测都没抓到，这个 job 专门覆盖它们：
  #   - 动态 chunk 404（构建产物缺失）
  #   - TabBar 路径写错（点 tab 落到兜底路由）
  #   - 页面渲染失败/内容空白
  ui-smoke:
    runs-on: self-hosted
    needs: [backend]
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: class_manage_sys_test
      DB_USER: ${{ secrets.CI_DB_USER || 'ci_runner' }}
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      JWT_SECRET: ci_only_test_secret_please_do_not_reuse
      SMOKE_BASE: http://127.0.0.1:3199
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: Install frontend deps
        run: npm ci --legacy-peer-deps
        working-directory: frontend-v3
      - name: 构建 H5（同源构建，不注入生产 API 地址）
        # ⚠️ 这里刻意不设 VITE_API_BASE_URL：冒烟跑在 http://127.0.0.1:3199 的**测试实例**上，
        # 若前端被构建成调用 https://cls.ayinserver.xin，浏览器会因跨域被拦（曾经因此红过），
        # 而且会把测试流量打到生产库。留空即走同源相对路径，正好命中测试实例。
        run: npm run build
        working-directory: frontend-v3
      - name: 应用测试库迁移
        run: node scripts/migrate.js up
        working-directory: backend
      - name: 准备冒烟账号
        id: seed
        run: node tests/seed-smoke-user.js | tee /tmp/smoke-seed.txt
        working-directory: backend
      - name: 启动测试实例
        run: |
          cd backend
          PORT=3199 AGENT_LLM_MODE=mock nohup node app.js > /tmp/smoke-server.log 2>&1 &
          echo $! > /tmp/smoke-server.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3199/health > /dev/null; then echo "服务已就绪"; exit 0; fi
            sleep 1
          done
          echo "::error::测试实例启动超时"; tail -30 /tmp/smoke-server.log; exit 1
      - name: 浏览器冒烟
        run: |
          SMOKE_USER_ID=$(grep -oP 'SMOKE_USER_ID=\K\d+' /tmp/smoke-seed.txt)
          export SMOKE_USER_ID
          # 在 backend 目录下签发令牌（那里有 jsonwebtoken 依赖）
          cd backend
          SMOKE_TOKEN=$(node -e "const jwt=require('jsonwebtoken');console.log(jwt.sign({id:Number(process.env.SMOKE_USER_ID),role:8},process.env.JWT_SECRET,{expiresIn:'1h'}))")
          export SMOKE_TOKEN
          cd ../frontend-v3
          node scripts/smoke-ui.mjs
      - name: 收集日志并停止实例
        if: always()
        run: |
          echo "===== 测试实例日志（尾部） ====="
          tail -40 /tmp/smoke-server.log || true
          if [ -f /tmp/smoke-server.pid ]; then kill "$(cat /tmp/smoke-server.pid)" 2>/dev/null || true; fi

  # 对话助手工具选择评测（模型/提示词/工具表改动后的回归门禁）
  #
  # 为什么放在这里：runner 是**自托管**在这台机器上的，能直接访问本地 llama-server，
  # 所以这个门禁不花钱、也有意义（通用榜单如 BFCL 测的是英文通用函数调用，
  # 与我们"固定中文工具表 + 算日期填参数 + 权限边界"不是一回事，不能替代）。
  #
  # 本地模型没在跑时**跳过而不是失败**：它是可选依赖，不该因为它没起来就阻断全部 CI；
  # 真挂了会由 class-mansys-agent-usage.timer 的健康告警报出来（见 docs/OPERATIONS.md §14）。
  agent-eval:
    runs-on: self-hosted
    needs: [backend]
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: class_manage_sys_test
      DB_USER: ${{ secrets.CI_DB_USER || 'ci_runner' }}
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      JWT_SECRET: ci_only_test_secret_please_do_not_reuse
      EVAL_BASE_URL: http://127.0.0.1:8090/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: 应用测试库迁移
        run: node scripts/migrate.js up
        working-directory: backend
      - name: 本地模型可用性检查
        id: probe
        run: |
          if curl -sf --max-time 5 "$EVAL_BASE_URL/models" > /dev/null; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
            echo "本地模型可用，将执行评测"
          else
            echo "ready=0" >> "$GITHUB_OUTPUT"
            echo "::warning::本地模型不可用（$EVAL_BASE_URL），跳过本次评测"
          fi
        working-directory: backend
      - name: 对话助手工具选择评测
        if: steps.probe.outputs.ready == '1'
        run: node tests/eval/run.mjs --base-url "$EVAL_BASE_URL" --rounds 2 --min-score 92 --json /tmp/agent-eval.json
        working-directory: backend
      - name: 上传评测结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-result
          path: /tmp/agent-eval.json
          if-no-files-found: ignore

  frontend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend-v3
      - name: Lint
        run: npm run lint
        working-directory: frontend-v3
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend-v3
      - name: Unit tests
        run: npm test
        working-directory: frontend-v3
      - name: Build
        run: npm run build
        working-directory: frontend-v3
        env:
          VITE_API_BASE_URL: https://cls.ayinserver.xin
