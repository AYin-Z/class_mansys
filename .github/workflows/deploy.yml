name: Deploy H5 (frontend only)

on:
  # push 到 main 时仅触发 Android 构建流程（android-build.yml），
  # 本流程仅手动执行 H5 快速部署
  workflow_dispatch:
    inputs:
      reason:
        description: '部署原因'
        required: false
        default: '手动 H5 热更新'

jobs:
  deploy-h5:
    runs-on: self-hosted

    steps:
      - name: Git pull latest code
        run: |
          cd /home/ayin/Current_Works/class_mansys
          git pull

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        working-directory: /home/ayin/Current_Works/class_mansys/frontend-v3

      - name: Build H5 (production)
        run: npm run build
        working-directory: /home/ayin/Current_Works/class_mansys/frontend-v3
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://cls.ayinserver.xin' }}

      - name: Restart backend
        run: |
          export XDG_RUNTIME_DIR=/run/user/1000
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
          systemctl --user restart class-mansys.service

      - name: Verify deployment
        run: |
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3002/)
          echo "Frontend status: $STATUS"
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3002/api/auth/send-code -H 'Content-Type: application/json' -d '{"phone":"13800138000"}')
          echo "Backend API status: $API_STATUS"
          if [ "$STATUS" != "200" ]; then exit 1; fi
