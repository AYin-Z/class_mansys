apply plugin: 'com.android.application'

android {
    namespace = "com.clamansys.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.clamansys.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode: CI 自动生成（YYYYMMDD + 序号），也可手动 -PversionCode=xxx 覆盖
        versionCode project.findProperty('versionCode')?.toInteger() ?: 100
        versionName project.findProperty('versionName') ?: "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // ── 签名配置 ──
    // 从环境变量读取，CI 自动注入；本地开发用 debug 签名
    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "/dev/null")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    // ── 多环境 flavor ──
    flavorDimensions "env"
    productFlavors {
        dev {
            dimension "env"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "区队管理·开发"
            buildConfigField "String", "API_BASE_URL", '"https://dev-api.ayinserver.xin"'
        }
        demo {
            dimension "env"
            applicationIdSuffix ".demo"
            versionNameSuffix "-demo"
            resValue "string", "app_name", "区队管理·演示"
            buildConfigField "String", "API_BASE_URL", '"https://demo-api.ayinserver.xin"'
        }
        prod {
            dimension "env"
            applicationIdSuffix ""
            versionNameSuffix ""
            resValue "string", "app_name", "区队管理系统"
            buildConfigField "String", "API_BASE_URL", '"https://cls.ayinserver.xin"'
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            // CI 下签名，本地无 KEYSTORE_PATH 则降级为 debug 签名
            signingConfig System.getenv("KEYSTORE_PATH") ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // flavor + buildType 变体过滤：非生产环境仅构建 debug
    variantFilter { variant ->
        def names = variant.flavors*.name
        def isDev = names.contains("dev") || names.contains("demo")
        def isRelease = variant.buildType.name == "release"
        if (isDev && isRelease) {
            setIgnore(true)
        }
    }

    // BuildConfig 已弃用，需要手动开启
    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
