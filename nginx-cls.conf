# class_mansys — Nginx reverse proxy for cls.ayinserver.xin
# Include this in /etc/nginx/sites-enabled/ and reload nginx.

server {
    listen 127.0.0.1:8083;
    server_name cls.ayinserver.xin;

    # ── Upload limits ──
    client_max_body_size 110m;
    client_body_timeout 120s;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Security headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Static assets (Vite hashed filenames = immutable) ──
    location /assets/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── API (includes upload endpoints) ──
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;
        proxy_request_buffering off;

        add_header Cache-Control "no-store";
    }

    # ── Uploaded files ──
    location /uploads/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;

        expires 7d;
        add_header Cache-Control "public";
    }

    # ── APK downloads ──
    location /apk/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;

        expires 1d;
        add_header Cache-Control "public";
    }

    # ── Health check ──
    location /health {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;

        add_header Cache-Control "no-store";
    }

    # ── SPA fallback (everything else → index.html) ──
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}